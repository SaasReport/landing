# admin.saasreport.ai: the SaasReport admin Worker (docs/ADMIN.md). Hand-written because the kit generates wrangler.toml for the comms
# Workers only (a kit change is proposed in the pull request: a generator for a project Worker from admin.config.json).
# Names follow the naming registry; `admin` as a component and as a host sub wait for SaasReport/core claude/naming-admin.
# Every id below is a placeholder the lead replaces from the real resource. Secrets are set on the Worker by the lead, never in this file:
#   ACCESS_TEAM_DOMAIN, ACCESS_AUD, ADMIN_ALLOWED_EMAILS (required), GITHUB_READ_TOKEN (optional, read-only)
name = "saasreport-admin-production"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

# The generated interface (kit site build --config workers/admin/ui/site.config.js). The Worker runs first, so Access is verified before any asset.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

# The admin's own database: the append-only audit log, the lead state, the idempotency records.
[[d1_databases]]
binding = "DB"
database_name = "saasreport-admin-production"
database_id = "TODO: wrangler d1 create saasreport-admin-production (pending: the lead)"
migrations_dir = "migrations"

# The comms engine's database (comms_form_deliveries, comms_dispatch, comms_suppression, comms_inbound, leads). Shared with the engine and the
# site Worker, which already bind it; the admin writes only comms_suppression (a removal). Its migrations belong to the engine.
[[d1_databases]]
binding = "ENGINE_DB"
database_name = "saasreport-comms-engine-production"
database_id = "TODO: the id of the comms engine's D1 (pending: the lead)"

# The comms engine: retries go through its idempotent POST /v1/comms/submit, suppressions through POST /v1/comms/suppress.
[[services]]
binding = "COMMS"
service = "saasreport-comms-engine"

# Route (the lead, with the Access application): admin.saasreport.ai as a custom domain of this Worker, only behind Cloudflare Access.

[observability]
enabled = true
