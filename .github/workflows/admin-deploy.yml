# Deploys the admin Worker (admin.saasreport.ai, docs/ADMIN.md). workflow_dispatch ONLY until its first run has passed: no push, no
# pull_request and no schedule trigger may exist while the secrets below have never been proven (a trigger that runs unprovisioned
# fails on every push). The author of a change never runs this: the owner starts it, in the production environment.
# Credentials are the account's existing Actions secrets, no new names: CLOUDFLARE_API_KEY (the API token, mapped to CLOUDFLARE_API_TOKEN
# for wrangler), CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_ZONE_ID. Their presence is checked first as booleans; a value is never printed.
# Order: the tests, then the migrations of each D1, then the Access secrets, then the Worker.
name: admin-deploy
on:
  workflow_dispatch:
concurrency:
  group: admin-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    name: deploy (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: the credentials are present (booleans only)
        env:
          HAS_CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY != '' }}
          HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID != '' }}
        run: |
          missing=""
          [ "$HAS_CLOUDFLARE_API_KEY" = "true" ] || missing="$missing CLOUDFLARE_API_KEY"
          [ "$HAS_CLOUDFLARE_ACCOUNT_ID" = "true" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ "$HAS_CLOUDFLARE_ZONE_ID" = "true" ] || missing="$missing CLOUDFLARE_ZONE_ID"
          if [ -n "$missing" ]; then echo "::error::missing Actions secret(s):$missing"; exit 1; fi
          echo "all three Cloudflare secrets are present"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: build and test the admin
        run: |
          npm run build
          npm run check:admin
          npm run test:admin
      - name: migrations, each D1 first (the admin's own, then the comms engine's)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply DB --remote -c workers/admin/wrangler.toml
          npx wrangler d1 migrations apply ENGINE_DB --remote -c workers/admin/wrangler.toml
      - name: the Access secrets, read from Cloudflare and written to the Worker (names only in the log)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/admin-secrets.mjs
      - name: deploy the Worker with its commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: npx wrangler deploy -c workers/admin/wrangler.toml --var BUILD_COMMIT:${{ github.sha }}
